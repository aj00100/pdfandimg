<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <radialGradient id="limeGlow" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#C8F135" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C8F135" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="85%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="limeIso" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF47" />
      <stop offset="50%" stop-color="#C8F135" />
      <stop offset="100%" stop-color="#38E54D" />
    </linearGradient>
    <linearGradient id="midIso" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(200, 241, 53, 0.45)" />
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0.25)" />
    </linearGradient>
  </defs>

  <!-- Obsidian Canvas -->
  <rect width="1200" height="630" fill="#0A0A0B"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#limeGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>

  <!-- Outer Precision Frame -->
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  
  <!-- Corner Accents -->
  <path d="M 28 88 V 44 C 28 35.163 35.163 28 44 28 H 88" fill="none" stroke="#C8F135" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1172 542 V 586 C 1172 594.837 1164.84 602 1156 602 H 1112" fill="none" stroke="#C8F135" stroke-width="3" stroke-linecap="round"/>

  <!-- Brand Lockup with Concept 4 Emblem -->
  <g transform="translate(80, 110)">
    <!-- 64x64 Squircle Badge -->
    <rect width="64" height="64" rx="16" fill="#141417" stroke="rgba(200,241,53,0.35)" stroke-width="2"/>
    
    <!-- Mini Isometric Stack Emblem -->
    <g transform="translate(32, 32) scale(0.11) translate(-256, -256)">
      <!-- Bottom Layer -->
      <path d="M 256 264 L 408 340 L 256 416 L 104 340 Z" fill="url(#limeIso)" />
      <path d="M 104 340 L 256 416 L 408 340 L 408 362 L 256 438 L 104 362 Z" fill="#28A738" />
      <!-- Middle Layer -->
      <path d="M 256 184 L 388 250 L 256 316 L 124 250 Z" fill="url(#midIso)" stroke="#C8F135" stroke-width="4" stroke-linejoin="round" />
      <!-- Top Layer -->
      <path d="M 256 104 L 368 160 L 256 216 L 144 160 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.5)" stroke-width="6" stroke-dasharray="16 10" stroke-linejoin="round" />
    </g>
    
    <text x="84" y="45" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.5" fill="#F4F4F5">
      Pdf<tspan fill="#C8F135">And</tspan>Img
    </text>
  </g>

  <!-- Privacy Badge -->
  <g transform="translate(80, 210)">
    <rect width="230" height="32" rx="16" fill="rgba(200,241,53,0.1)" stroke="rgba(200,241,53,0.3)" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#C8F135"/>
    <text x="34" y="21" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#C8F135" letter-spacing="1.2">
      100% LOCAL IN-BROWSER
    </text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="310" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-2" fill="#FFFFFF">
    Exact-KB Image
  </text>
  <text x="80" y="378" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-2" fill="#C8F135">
    &amp; Local PDF Studio.
  </text>

  <!-- Subheadline -->
  <text x="80" y="430" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#9898A6">
    Zero server uploads. Binary-search target lock for exam &amp; legal portals.
  </text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(80, 485)">
    <rect width="165" height="38" rx="8" fill="#141417" stroke="rgba(255,255,255,0.1)"/>
    <text x="82.5" y="24" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#E4E4E7" text-anchor="middle">10KB – 500KB Lock</text>
    
    <rect x="180" width="155" height="38" rx="8" fill="#141417" stroke="rgba(255,255,255,0.1)"/>
    <text x="257.5" y="24" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#E4E4E7" text-anchor="middle">PDF Redact/Split</text>

    <rect x="350" width="155" height="38" rx="8" fill="rgba(34,211,238,0.08)" stroke="rgba(34,211,238,0.25)"/>
    <text x="427.5" y="24" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#22D3EE" text-anchor="middle">WASM / Canvas</text>
  </g>

  <!-- Right Side: Interactive UI Card Mockup -->
  <g transform="translate(680, 140)">
    <rect x="24" y="24" width="440" height="340" rx="18" fill="#111113" stroke="rgba(255,255,255,0.05)"/>
    <rect width="440" height="340" rx="18" fill="#16161A" stroke="rgba(200,241,53,0.25)" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="440" height="44" rx="18" fill="#1E1E24"/>
    <circle cx="24" cy="22" r="5.5" fill="#FF5F56"/>
    <circle cx="42" cy="22" r="5.5" fill="#FFBD2E"/>
    <circle cx="60" cy="22" r="5.5" fill="#27C93F"/>
    <text x="220" y="26" font-family="ui-monospace, monospace" font-size="12" fill="#71717A" text-anchor="middle">target-lock-engine v3.0</text>

    <!-- Before / After Telemetry -->
    <rect x="28" y="70" width="175" height="90" rx="12" fill="#111113" stroke="rgba(255,255,255,0.06)"/>
    <text x="44" y="98" font-family="ui-monospace, monospace" font-size="11" fill="#71717A">SOURCE INPUT</text>
    <text x="44" y="136" font-family="ui-monospace, monospace" font-size="28" font-weight="700" fill="#F43F5E">2.48 MB</text>

    <rect x="237" y="70" width="175" height="90" rx="12" fill="rgba(200,241,53,0.06)" stroke="rgba(200,241,53,0.3)"/>
    <text x="253" y="98" font-family="ui-monospace, monospace" font-size="11" fill="#C8F135">LOCKED OUTPUT</text>
    <text x="253" y="136" font-family="ui-monospace, monospace" font-size="28" font-weight="700" fill="#C8F135">19.8 KB</text>

    <!-- Terminal Output Log -->
    <text x="32" y="200" font-family="ui-monospace, monospace" font-size="13" fill="#A1A1AA">&gt; DCT binary search: <tspan fill="#F4F4F5">8 iterations</tspan></text>
    <text x="32" y="226" font-family="ui-monospace, monospace" font-size="13" fill="#A1A1AA">&gt; Chroma subsampling: <tspan fill="#22D3EE">4:2:0 optimal</tspan></text>
    <text x="32" y="252" font-family="ui-monospace, monospace" font-size="13" fill="#C8F135">✓ Verified compliant (SSC / UPSC / GATE)</text>

    <!-- Progress Bar -->
    <rect x="28" y="285" width="384" height="10" rx="5" fill="#27272A"/>
    <rect x="28" y="285" width="376" height="10" rx="5" fill="url(#limeIso)"/>
  </g>
</svg>
