<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background base -->
    <rect id="bg" width="1200" height="630"/>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>

    <!-- Lime glow radial -->
    <radialGradient id="limeGlow" cx="18%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#c8f135" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c8f135" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan glow radial -->
    <radialGradient id="cyanGlow" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="#0a0a0b"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow accents -->
  <rect width="1200" height="630" fill="url(#limeGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>

  <!-- Border frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Top-left corner accent -->
  <line x1="24" y1="24" x2="120" y2="24" stroke="#c8f135" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="24" y2="120" stroke="#c8f135" stroke-width="2" stroke-linecap="round"/>

  <!-- Bottom-right corner accent -->
  <line x1="1176" y1="606" x2="1080" y2="606" stroke="#c8f135" stroke-width="2" stroke-linecap="round"/>
  <line x1="1176" y1="606" x2="1176" y2="510" stroke="#c8f135" stroke-width="2" stroke-linecap="round"/>

  <!-- Logo mark (upload arrow icon) -->
  <g transform="translate(80, 220)">
    <rect width="64" height="64" rx="14" fill="rgba(200,241,53,0.12)" stroke="rgba(200,241,53,0.3)" stroke-width="1.5"/>
    <path d="M20 44V47.5C20 49.43 21.57 51 23.5 51H40.5C42.43 51 44 49.43 44 47.5V44M32 13V35.5M32 13L23.5 21.5M32 13L40.5 21.5"
          stroke="#c8f135" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand name -->
  <text x="160" y="268" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="800"
        fill="#f0f0f2" letter-spacing="-2.5">PDFandIMG</text>

  <!-- Tagline -->
  <text x="80" y="320" font-family="'Outfit', system-ui, sans-serif" font-size="22" font-weight="400"
        fill="#9898a6" letter-spacing="0">Compress images to exact KB — free, fast, private.</text>

  <!-- Divider line -->
  <line x1="80" y1="356" x2="520" y2="356" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Feature pills row -->
  <!-- Pill 1 -->
  <rect x="80" y="376" width="148" height="36" rx="18" fill="rgba(200,241,53,0.08)" stroke="rgba(200,241,53,0.22)" stroke-width="1"/>
  <text x="154" y="399" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600"
        fill="#c8f135" text-anchor="middle" letter-spacing="0.04em">100% PRIVATE</text>

  <!-- Pill 2 -->
  <rect x="242" y="376" width="148" height="36" rx="18" fill="rgba(34,211,238,0.07)" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
  <text x="316" y="399" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600"
        fill="#22d3ee" text-anchor="middle" letter-spacing="0.04em">BROWSER ONLY</text>

  <!-- Pill 3 -->
  <rect x="404" y="376" width="148" height="36" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="478" y="399" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600"
        fill="#9898a6" text-anchor="middle" letter-spacing="0.04em">ZERO UPLOAD</text>

  <!-- Right side: Terminal mockup -->
  <rect x="660" y="160" width="476" height="300" rx="14"
        fill="#0d0d0f" stroke="rgba(200,241,53,0.2)" stroke-width="1.5"/>

  <!-- Terminal titlebar -->
  <rect x="660" y="160" width="476" height="38" rx="14" fill="#111113"/>
  <rect x="660" y="178" width="476" height="20" fill="#111113"/>

  <!-- Traffic lights -->
  <circle cx="690" cy="179" r="6" fill="#ff5f57"/>
  <circle cx="710" cy="179" r="6" fill="#febc2e"/>
  <circle cx="730" cy="179" r="6" fill="#28c840"/>

  <!-- Terminal title text -->
  <text x="898" y="184" font-family="'IBM Plex Mono', monospace" font-size="11"
        fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="0.06em">target-lock v3.0</text>

  <!-- Separator line -->
  <line x1="660" y1="198" x2="1136" y2="198" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Terminal lines -->
  <text x="684" y="226" font-family="'IBM Plex Mono', monospace" font-size="12.5" fill="#c8f135">$ pdfandimg --target 20kb --mode target-lock</text>
  <text x="684" y="252" font-family="'IBM Plex Mono', monospace" font-size="12.5" fill="rgba(255,255,255,0.38)">  reading input   ·  187.4kb  ·  JPEG</text>
  <text x="684" y="278" font-family="'IBM Plex Mono', monospace" font-size="12.5" fill="rgba(255,255,255,0.38)">  binary search   ·  8 iterations  ·  converged</text>
  <text x="684" y="304" font-family="'IBM Plex Mono', monospace" font-size="12.5" fill="rgba(255,255,255,0.38)">  quality lock    ·  q=71  ·  chroma 4:2:0</text>
  <text x="684" y="330" font-family="'IBM Plex Mono', monospace" font-size="12.5" fill="rgba(255,255,255,0.38)">  output          ·  19.8kb  ·  saved 89%</text>
  <text x="684" y="358" font-family="'IBM Plex Mono', monospace" font-size="12.5" fill="#c8f135">✓ done</text>

  <!-- Blinking cursor (static in SVG) -->
  <rect x="724" y="365" width="8" height="14" rx="1" fill="#c8f135" opacity="0.9"/>

  <!-- Progress bar at bottom of terminal -->
  <rect x="660" y="448" width="476" height="3" rx="0" fill="rgba(255,255,255,0.05)"/>
  <rect x="660" y="448" width="476" height="3" rx="0" fill="#c8f135"/>

  <!-- Bottom status bar -->
  <rect x="24" y="558" width="1152" height="1" fill="rgba(255,255,255,0.06)"/>

  <!-- Bottom left: URL -->
  <text x="80" y="596" font-family="'IBM Plex Mono', monospace" font-size="13"
        fill="#5a5a6a" letter-spacing="0.02em">pdfandimg.com</text>

  <!-- Bottom right: Target sizes list -->
  <text x="1120" y="596" font-family="'IBM Plex Mono', monospace" font-size="12"
        fill="#5a5a6a" text-anchor="end" letter-spacing="0.02em">10KB · 20KB · 50KB · 100KB · 200KB · 1MB</text>
</svg>
